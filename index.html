<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>STEM Shield Duel: Mech Training Arena</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      background-color: #060212;
      color: #e0f2fe;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      width: 100vw;
      overflow: hidden;
      padding: 10px;
    }
    /* Responsive Scaling Container */
    #game-container {
      position: relative;
      width: 100%;
      max-width: 980px;
      aspect-ratio: 980 / 580; /* Maintains exact 16:9.5 ratio on all screens */
      border: 2px solid #00f0ff;
      box-shadow: 0 0 35px rgba(0, 240, 255, 0.4), inset 0 0 20px rgba(168, 85, 247, 0.3);
      border-radius: 12px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 15%, #1e0938 0%, #05010c 90%);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    /* Top HUD */
    #hud-top {
      position: absolute;
      top: 3%;
      left: 3%;
      right: 3%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: clamp(10px, 1.8vw, 14px);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 700;
      text-shadow: 0 0 10px #00f0ff;
      pointer-events: none;
      z-index: 5;
    }
    .hud-chip {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #00f0ff;
      padding: clamp(4px, 1vw, 8px) clamp(8px, 1.8vw, 18px);
      border-radius: 6px;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.25);
    }
    /* STEM Frequency Console (Responsive Overlay) */
    #puzzle-overlay {
      position: absolute;
      bottom: 3.5%;
      left: 50%;
      transform: translateX(-50%);
      width: 85%;
      max-width: 550px;
      background: rgba(10, 5, 25, 0.92);
      border: 2px solid #a855f7;
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.5);
      padding: clamp(8px, 1.8vw, 14px) clamp(12px, 2.5vw, 24px);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(6px, 1.2vw, 10px);
      backdrop-filter: blur(8px);
      transition: border-color 0.2s;
      z-index: 5;
    }
    #puzzle-title {
      font-size: clamp(9px, 1.5vw, 13px);
      color: #38bdf8;
      letter-spacing: 1.2px;
      font-weight: bold;
      text-shadow: 0 0 6px #38bdf8;
      text-align: center;
    }
    #math-problem {
      font-size: clamp(14px, 2.6vw, 22px);
      font-weight: bold;
      color: #ffffff;
      letter-spacing: 1.5px;
      text-shadow: 0 0 12px #a855f7;
    }
    .choice-group {
      display: flex;
      gap: clamp(8px, 1.5vw, 14px);
      width: 100%;
      justify-content: center;
    }
    .choice-btn {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid #00f0ff;
      color: #fff;
      font-weight: bold;
      font-size: clamp(12px, 2vw, 16px);
      padding: clamp(6px, 1.2vw, 8px) clamp(10px, 2vw, 20px);
      border-radius: 6px;
      cursor: pointer;
      outline: none;
      transition: all 0.15s ease;
      touch-action: manipulation;
    }
    .choice-btn:active, .choice-btn:hover {
      background: #00f0ff;
      color: #05010d;
      box-shadow: 0 0 14px #00f0ff;
      transform: translateY(-2px);
    }
    /* Game Over Modal */
    #game-over-screen {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(4, 1, 10, 0.95);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 10;
      padding: 20px;
      text-align: center;
    }
    #game-over-screen h1 {
      font-size: clamp(20px, 4vw, 36px);
      color: #f43f5e;
      text-shadow: 0 0 18px #f43f5e;
    }
    #final-stats {
      font-size: clamp(12px, 2vw, 16px);
      letter-spacing: 1px;
    }
    .restart-btn {
      padding: clamp(8px, 1.5vw, 12px) clamp(16px, 3vw, 26px);
      background: #00f0ff;
      border: none;
      border-radius: 6px;
      color: #030712;
      font-weight: bold;
      font-size: clamp(12px, 2vw, 16px);
      cursor: pointer;
      box-shadow: 0 0 16px #00f0ff;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <!-- Internal coordinate canvas remains stable at 980x580 -->
    <canvas id="gameCanvas" width="980" height="580"></canvas>

    <div id="hud-top">
      <div class="hud-chip">SHIELD: <span id="shield-count">3</span> / 3</div>
      <div class="hud-chip">SYNC: <span id="score-count">0</span>%</div>
    </div>

    <div id="puzzle-overlay">
      <div id="puzzle-title">SYNCHRONIZE SHIELD FREQUENCY (Hz)</div>
      <div id="math-problem">CALCULATING...</div>
      <div class="choice-group" id="choices-box"></div>
    </div>

    <div id="game-over-screen">
      <h1>SHIELD OVERLOAD</h1>
      <p id="final-stats">Core Sync: 0%</p>
      <button class="restart-btn" onclick="resetGame()">RECALIBRATE CORE</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Preload Cutout Assets
    const heroImg = new Image();
    heroImg.src = 'hero.png';

    const mechImg = new Image();
    mechImg.src = 'mech.png';

    // Native Web Audio Synthesizer
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTone(freq, type = 'sine', duration = 0.15) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    // Touch / Click unlock for mobile browsers (Audio autoplay policy)
    window.addEventListener('touchstart', initAudio, { once: true });
    window.addEventListener('click', initAudio, { once: true });

    let health = 3;
    let score = 0;
    let gameOver = false;
    let particles = [];
    let currentProblem = null;
    let shieldActiveTimer = 0;

    // Hero Entity (Fixed to 980x580 coordinate system)
    const hero = {
      x: 70,
      y: 180,
      width: 250,
      height: 310,
      draw() {
        ctx.save();
        ctx.beginPath();
        ctx.ellipse(this.x + 125, this.y + 295, 75, 14, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0, 240, 255, 0.2)';
        ctx.shadowColor = '#00f0ff';
        ctx.shadowBlur = 15;
        ctx.fill();
        ctx.restore();

        if (heroImg.complete && heroImg.naturalHeight !== 0) {
          ctx.drawImage(heroImg, this.x, this.y, this.width, this.height);
        }

        if (shieldActiveTimer > 0) {
          ctx.save();
          ctx.strokeStyle = '#00f0ff';
          ctx.lineWidth = 4;
          ctx.shadowColor = '#00f0ff';
          ctx.shadowBlur = 30;
          ctx.fillStyle = 'rgba(0, 240, 255, 0.22)';
          
          const hx = this.x + 230;
          const hy = this.y + 175;
          const size = 95;
          
          ctx.beginPath();
          for (let i = 0; i < 6; i++) {
            const angle = (Math.PI / 3) * i;
            const px = hx + size * Math.cos(angle);
            const py = hy + size * Math.sin(angle);
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.closePath();
          ctx.stroke();
          ctx.fill();

          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(hx, hy - size);
          ctx.lineTo(hx, hy + size);
          ctx.moveTo(hx - size * 0.866, hy);
          ctx.lineTo(hx + size * 0.866, hy);
          ctx.stroke();
          ctx.restore();

          shieldActiveTimer--;
        }
      }
    };

    // Mech Entity (Flipped horizontally to face left)
    const mech = {
      x: 620,
      y: 90,
      width: 320,
      height: 400,
      draw() {
        ctx.save();
        ctx.beginPath();
        ctx.ellipse(this.x + 160, this.y + 380, 110, 18, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(168, 85, 247, 0.25)';
        ctx.shadowColor = '#a855f7';
        ctx.shadowBlur = 18;
        ctx.fill();

        if (mechImg.complete && mechImg.naturalHeight !== 0) {
          ctx.save();
          ctx.translate(this.x + this.width, this.y);
          ctx.scale(-1, 1);
          ctx.drawImage(mechImg, 0, 0, this.width, this.height);
          ctx.restore();
        }

        ctx.beginPath();
        ctx.arc(this.x + 120, this.y + 145, 9 + Math.sin(Date.now() * 0.015) * 4, 0, Math.PI * 2);
        ctx.fillStyle = '#00f0ff';
        ctx.shadowColor = '#00f0ff';
        ctx.shadowBlur = 25;
        ctx.fill();

        ctx.restore();
      }
    };

    let projectiles = [];

    class PlasmaBlast {
      constructor(speed) {
        this.x = mech.x + 110;
        this.y = mech.y + 145;
        this.radius = 18;
        this.speed = speed;
      }
      update() {
        this.x -= this.speed;
        if (Math.random() < 0.6) {
          particles.push(new Particle(this.x + 12, this.y, '#00f0ff'));
        }
      }
      draw() {
        ctx.save();
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#00f0ff';
        ctx.shadowBlur = 25;
        ctx.fill();

        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius + 8, 0, Math.PI * 2);
        ctx.strokeStyle = '#a855f7';
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.restore();
      }
    }

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.vx = (Math.random() - 0.5) * 8;
        this.vy = (Math.random() - 0.5) * 8;
        this.alpha = 1;
        this.size = Math.random() * 4 + 2;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= 0.035;
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function generateQuestion() {
      const types = ['add', 'mult', 'freq'];
      const chosen = types[Math.floor(Math.random() * types.length)];
      let text = '';
      let correct = 0;

      if (chosen === 'add') {
        const a = Math.floor(Math.random() * 25) + 12;
        const b = Math.floor(Math.random() * 25) + 8;
        text = `HARMONIC: ${a} + ${b} = ?`;
        correct = a + b;
      } else if (chosen === 'mult') {
        const a = Math.floor(Math.random() * 8) + 4;
        const b = Math.floor(Math.random() * 9) + 3;
        text = `AMPLITUDE: ${a} × ${b} = ?`;
        correct = a * b;
      } else {
        const f = Math.floor(Math.random() * 4) + 2;
        text = `FREQUENCY: 240 / ${f} = ?`;
        correct = 240 / f;
      }

      const choices = [correct];
      while (choices.length < 3) {
        const delta = (Math.random() < 0.5 ? -1 : 1) * (Math.floor(Math.random() * 6) + 3);
        const wrong = correct + delta;
        if (!choices.includes(wrong) && wrong > 0) choices.push(wrong);
      }
      choices.sort(() => Math.random() - 0.5);

      currentProblem = { text, correct, choices };
      renderPuzzleUI();
    }

    function renderPuzzleUI() {
      document.getElementById('math-problem').innerText = currentProblem.text;
      const box = document.getElementById('choices-box');
      box.innerHTML = '';
      currentProblem.choices.forEach(val => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.innerText = `${val} Hz`;
        btn.onclick = (e) => {
          initAudio();
          verifyAnswer(val);
        };
        box.appendChild(btn);
      });
    }

    function verifyAnswer(chosen) {
      if (gameOver) return;

      if (chosen === currentProblem.correct) {
        shieldActiveTimer = 40;
        playTone(587.33, 'triangle', 0.2);
        setTimeout(() => playTone(880, 'sine', 0.25), 100);

        if (projectiles.length > 0) {
          const blast = projectiles[0];
          for (let i = 0; i < 30; i++) {
            particles.push(new Particle(blast.x, blast.y, '#00f0ff'));
            particles.push(new Particle(blast.x, blast.y, '#a855f7'));
          }
          projectiles.shift();
          score += 15;
          document.getElementById('score-count').innerText = score;
        }
        generateQuestion();
      } else {
        playTone(110, 'sawtooth', 0.35);
        document.getElementById('puzzle-overlay').style.borderColor = '#ef4444';
        setTimeout(() => {
          document.getElementById('puzzle-overlay').style.borderColor = '#a855f7';
        }, 300);
      }
    }

    const stars = Array.from({ length: 55 }, () => ({
      x: Math.random() * 980,
      y: Math.random() * 320,
      size: Math.random() * 2 + 0.5,
      alpha: Math.random() * 0.8 + 0.2
    }));

    function drawEnvironment() {
      stars.forEach(s => {
        ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
      });

      // Distant Ringed Planet
      ctx.save();
      ctx.beginPath();
      ctx.arc(490, 80, 36, 0, Math.PI * 2);
      ctx.fillStyle = '#1e1b4b';
      ctx.shadowColor = '#818cf8';
      ctx.shadowBlur = 22;
      ctx.fill();
      ctx.ellipse(490, 80, 68, 12, -0.22, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(129, 140, 248, 0.45)';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.restore();

      // Cyber Floor Grid
      const horizon = 440;
      ctx.strokeStyle = 'rgba(0, 240, 255, 0.22)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= canvas.width; i += 50) {
        ctx.beginPath();
        ctx.moveTo(i, horizon);
        ctx.lineTo(i - (canvas.width / 2 - i) * 0.75, canvas.height);
        ctx.stroke();
      }
      for (let y = horizon; y <= canvas.height; y += 28) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }
    }

    let lastSpawn =
